name: CI

on:
  push:
    # Tags are built by the release event below; building them here too would start a duplicate run.
    branches: ['**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # The extension builds with Visual Studio's MSBuild (VSSDK targets), so it needs a Windows runner.
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # A release tagged v0.2.0 builds version 0.2.0. Other builds use the project's default (0.1.0).
      - name: Version from release tag
        id: version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Release tag '$env:TAG' isn't a VSIX version. Use v1.2 to v1.2.3.4: numbers only, no suffix like -beta."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        run: dotnet format whitespace FancyComments.slnx --verify-no-changes

      # Code style rules from .editorconfig run as part of the build (see Directory.Build.props),
      # so any warning, style or otherwise, fails CI.
      - name: Build and lint
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: msbuild FancyComments.slnx -restore -p:Configuration=Release "-p:ExtensionVersion=$env:VERSION" -warnaserror -m -nologo -v:minimal

      - name: Test
        run: dotnet test FancyComments.Tests/FancyComments.Tests.csproj --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: FancyComments-vsix
          path: FancyComments/bin/Release/net472/FancyComments.vsix
          if-no-files-found: error

  # Only for releases, and only once the build and tests have passed.
  attach-to-release:
    if: github.event_name == 'release'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FancyComments-vsix

      - name: Attach VSIX to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        run: |
          mv FancyComments.vsix "FancyComments-$VERSION.vsix"
          gh release upload "$TAG" "FancyComments-$VERSION.vsix" --clobber --repo "$GITHUB_REPOSITORY"
